name: Test and publish a new release

on:
  workflow_call:
    inputs:
      verify_sbt_command:
        description: >-
          sbt command for verifying the build before publishing. Defaults to
          `cleanFull; +check; +all testFull package` on sbt 2 and `+clean; +check; +all test package`
          on sbt 1, detected from project/build.properties.
        type: string
        default: ''
      publish_sbt_command:
        description: 'sbt command for publishing artefacts to the Evo JFrog Artifactory'
        type: string
        default: '+publish'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SBT_CREDENTIALS: '.credentials'

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: restore cache
        uses: coursier/cache-action@v8

      - name: setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: setup SBT
        uses: sbt/setup-sbt@v1
        with:
          disk-cache: false

      - name: setup credentials
        run: |
          echo "realm=Artifactory Realm" >> ${{ env.SBT_CREDENTIALS }}
          echo "host=evolution.jfrog.io" >> ${{ env.SBT_CREDENTIALS }}
          echo "user=github-publish" >> ${{ env.SBT_CREDENTIALS }}
          echo "password=${{secrets.JFROG_ACCESS_TOKEN}}" >> ${{ env.SBT_CREDENTIALS }}

      - name: resolve verify command
        id: verify-command
        env:
          VERIFY_SBT_COMMAND: ${{ inputs.verify_sbt_command }}
        run: |
          if [[ -n "$VERIFY_SBT_COMMAND" ]]; then
            echo "command=$VERIFY_SBT_COMMAND" >> "$GITHUB_OUTPUT"
          elif grep -qE '^sbt\.version\s*=\s*2\.' project/build.properties; then
            # sbt 2 redefined `test` to run only tests that failed or never ran,
            # and its `clean` doesn't remove all generated classes
            echo "command=cleanFull; +check; +all testFull package" >> "$GITHUB_OUTPUT"
          else
            echo "command=+clean; +check; +all test package" >> "$GITHUB_OUTPUT"
          fi

      - name: verify the build
        env:
          VERIFY_SBT_COMMAND: ${{ steps.verify-command.outputs.command }}
        run: sbt "$VERIFY_SBT_COMMAND"

      - name: publish on JFrog Artifactory
        run: sbt "${{ inputs.publish_sbt_command }}"

      - name: cleanup credentials
        if: always()
        run: rm -rf ${{ env.SBT_CREDENTIALS }}

      - name: delete tag
        if: failure()
        run: git push --delete origin ${{ github.ref_name }}

      - name: publish release notes
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="v${tag#v}" \
              --generate-notes