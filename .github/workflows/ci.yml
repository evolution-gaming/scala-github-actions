name: Test a Scala project

on:
  workflow_call:
    inputs:
      scala_versions:
        description: 'JSON array of Scala versions to build against'
        type: string
        default: '["2.13.18", "3.3.8"]'
      java_version:
        description: 'JDK version'
        type: string
        default: '17'
      java_distribution:
        description: 'JDK distribution'
        type: string
        default: 'temurin'
      test_task:
        description: >-
          sbt task that runs the tests. Defaults to `testFull` on sbt 2 and `test` on sbt 1,
          detected from project/build.properties.
        type: string
        default: ''
      clean_task:
        description: >-
          Optional sbt task to run before the coverage build. Empty by default: the build output is
          restored from cache between runs, and `cleanFull` drops sbt 2's action cache.
        type: string
        default: ''
      sonar:
        description: >-
          Run a SonarQube Cloud scan. Requires a SONAR_TOKEN secret and an existing project on
          SonarQube Cloud with Automatic Analysis turned off, otherwise the two conflict.
        type: boolean
        default: false
      sonar_project_key:
        description: 'SonarQube project key. Defaults to <owner>_<repo>.'
        type: string
        default: ''
      sonar_args:
        description: 'Extra -D arguments for the Sonar scanner'
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        description: >-
          Only needed with `sonar: true`. Declared so callers do not have to use `secrets: inherit`,
          which SonarQube Cloud's own quality gate flags.
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbt-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: resolve test task
        id: test-task
        env:
          TEST_TASK: ${{ inputs.test_task }}
        run: |
          if [[ -n "$TEST_TASK" ]]; then
            echo "test=$TEST_TASK" >> "$GITHUB_OUTPUT"
          elif grep -qE '^sbt\.version\s*=\s*2\.' project/build.properties; then
            # sbt 2 redefined `test` to run only tests that failed or never ran
            echo "test=testFull" >> "$GITHUB_OUTPUT"
          else
            echo "test=test" >> "$GITHUB_OUTPUT"
          fi

      # sbt 1 has neither an action cache nor a `target/out`, so the coverage job skips the caching
      # steps there rather than pointing them at paths that do not exist.
      - name: detect sbt 2
        id: uses-sbt2
        run: |
          if grep -qE '^sbt\.version\s*=\s*2\.' project/build.properties; then
            echo "uses-sbt2=true" >> "$GITHUB_OUTPUT"
          else
            echo "uses-sbt2=false" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      test: ${{ steps.test-task.outputs.test }}
      uses-sbt2: ${{ steps.uses-sbt2.outputs.uses-sbt2 }}

  test-coverage:
    runs-on: ubuntu-latest
    needs: [sbt-tasks]
    strategy:
      fail-fast: false
      matrix:
        scala: ${{ fromJSON(inputs.scala_versions) }}

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # checkout whole history with all tags - required by `sonar` for blame
          fetch-depth: 0

      - name: restore cache
        uses: coursier/cache-action@v8

      - name: setup Java ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}
          cache: 'sbt'

      - name: setup SBT
        uses: sbt/setup-sbt@v1
        with:
          # the action's own disk cache is shared by every job and every matrix leg under one key,
          # so it cannot be paired with this job's `target`. Cached below instead.
          disk-cache: false

      # sbt's action cache restores `classes` but not `scoverage-data`, which the compiler writes as
      # a side effect of the instrumented compile. Restore the action cache without `target` and the
      # tests die writing their measurements into a directory that is not there, so the two are kept
      # in one entry under one key: either both come back or neither does.
      - name: restore build output
        if: needs.sbt-tasks.outputs.uses-sbt2 == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/sbt
            target/out
          key: sbt-coverage-${{ runner.os }}-java${{ inputs.java_version }}-scala${{ matrix.scala }}-${{ github.sha }}
          restore-keys: sbt-coverage-${{ runner.os }}-java${{ inputs.java_version }}-scala${{ matrix.scala }}-

      # Measurements are written per run and never pruned, so a restored `target` would fold the
      # previous run's hits into this report. The reports go too, otherwise the empty-report check
      # below can pass on a stale file.
      - name: drop stale coverage data
        if: needs.sbt-tasks.outputs.uses-sbt2 == 'true'
        run: |
          find . -path '*/scoverage-data/scoverage.measurements.*' -delete
          find . -type d \( -name coverage-report -o -name scoverage-report \) -prune -exec rm -rf {} +

      - name: build ${{ matrix.scala }}
        env:
          CLEAN_TASK: ${{ inputs.clean_task }}
          TEST_TASK: ${{ needs.sbt-tasks.outputs.test }}
          SCALA: ${{ matrix.scala }}
        run: |
          tasks="coverage; $TEST_TASK; coverageAggregate"
          if [[ -n "$CLEAN_TASK" ]]; then
            tasks="$CLEAN_TASK; $tasks"
          fi
          sbt "++$SCALA; $tasks"

      - name: locate coverage report
        id: coverage
        if: success()
        run: echo "file=$(find . -path '*/coverage-report/cobertura.xml' | head -1)" >> "$GITHUB_OUTPUT"

      - name: fail if coverage report is empty
        if: success()
        env:
          REPORT: ${{ steps.coverage.outputs.file }}
        run: |
          if [[ -z "$REPORT" || ! -f "$REPORT" ]]; then
            echo "::error::no cobertura report was produced"
            exit 1
          fi
          # Only the root <coverage> element's totals matter; individual classes may legitimately
          # have no lines.
          valid=$(grep -m1 -oE 'lines-valid="[0-9]+"' "$REPORT" | grep -oE '[0-9]+')
          if [[ "${valid:-0}" -eq 0 ]]; then
            echo "::error::coverage report is empty - instrumentation did not run"
            exit 1
          fi

      - name: upload coverage
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          file: ${{ steps.coverage.outputs.file }}
          format: cobertura
          flag-name: Scala ${{ matrix.scala }}
          parallel: true

      # Scanned once, on the first Scala version only: SonarQube tracks one analysis per branch, so
      # running it per matrix leg would have the legs overwrite each other.
      - name: sonar settings
        id: sonar
        if: inputs.sonar && matrix.scala == fromJSON(inputs.scala_versions)[0]
        env:
          KEY: ${{ inputs.sonar_project_key }}
        run: |
          if [[ -z "$KEY" ]]; then
            KEY="${GITHUB_REPOSITORY/\//_}"
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          # scoverage writes one report per module; Sonar takes a comma separated list
          reports=$(find . -path '*/scoverage-report/scoverage.xml' | paste -sd, -)
          echo "reports=$reports" >> "$GITHUB_OUTPUT"

      - name: sonar scan
        if: inputs.sonar && matrix.scala == fromJSON(inputs.scala_versions)[0]
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ steps.sonar.outputs.key }}
            -Dsonar.scala.coverage.reportPaths=${{ steps.sonar.outputs.reports }}
            ${{ inputs.sonar_args }}

  # Closes the parallel Coveralls build once every matrix leg has uploaded its part. Without
  # `parallel: true` the first upload closes the build and the other legs get rejected with
  # "Can't add a job to a build that is already closed".
  coverage-finished:
    runs-on: ubuntu-latest
    needs: [test-coverage]
    if: ${{ !cancelled() }}

    steps:
      - name: finish Coveralls build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

  binary-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ${{ fromJSON(inputs.scala_versions) }}

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # checkout whole history with all tags - required by `versionPolicyCheck` for version comparison
          fetch-depth: 0

      - name: restore cache
        uses: coursier/cache-action@v8

      - name: setup Java ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}
          cache: 'sbt'

      - name: setup SBT
        uses: sbt/setup-sbt@v1

      - name: binary compatibility ${{ matrix.scala }}
        run: sbt "++${{ matrix.scala }}; versionPolicyCheck"

  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: restore cache
        uses: coursier/cache-action@v8

      - name: setup Java ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}
          cache: 'sbt'

      - name: setup SBT
        uses: sbt/setup-sbt@v1

      - name: formatting
        run: sbt "scalafmtCheckRepo"

  scaladoc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala: ${{ fromJSON(inputs.scala_versions) }}

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: restore cache
        uses: coursier/cache-action@v8

      - name: setup Java ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}
          cache: 'sbt'

      - name: setup SBT
        uses: sbt/setup-sbt@v1
        with:
          # sbt 2's disk cache is restored across runs. Disable disk cache to force full Scaladoc recompilation
          disk-cache: false

      - name: scaladoc ${{ matrix.scala }}
        run: sbt "++${{ matrix.scala }}; Compile/doc"
