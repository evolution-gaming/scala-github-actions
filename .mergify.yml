shared:
  ci_passed: &ci_passed
    - check-success~=^test /
    - -check-pending~=^test /
    - -check-failure~=^test /
    - check-success=AI Policy Check

merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    merge_method: rebase
    update_method: rebase
    queue_conditions: *ci_passed
    merge_conditions: *ci_passed

pull_request_rules:
  - name: queue approved pull requests
    conditions:
      - base~=^(main|master)$
      - "#approved-reviews-by>=1"
      - "#changes-requested-reviews-by=0"
      - label!=do-not-merge
    actions:
      queue:

  - name: queue scala-steward updates
    conditions:
      - base~=^(main|master)$
      - author=scala-steward
      - label!=do-not-merge
    actions:
      queue:

  - name: flag non breaking changes
    conditions:
      - check-success~=^test / binary-compatibility
      - -check-pending~=^test / binary-compatibility
      - -check-failure~=^test / binary-compatibility
    actions:
      label:
        toggle:
          - non-breaking-change

  - name: flag binary incompatible changes
    conditions:
      - check-failure~=^test / binary-compatibility
    actions:
      label:
        toggle:
          - release-bump-needed
